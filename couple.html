<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Couple page</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,600;1,300&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button id="themeBtn" class="theme-toggle" aria-label="Toggle dark mode">
      <svg class="moon" viewBox="0 0 24 24">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
      </svg>
      <svg class="sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4.5" />
        <path
          d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"
        />
      </svg>
    </button>

    <div class="dash">
      <!-- Login -->
      <form id="login">
        <h1>Couple page</h1>
        <label for="em">Email</label>
        <input id="em" type="email" required autocomplete="username" />
        <label for="pw">Password</label>
        <input
          id="pw"
          type="password"
          required
          autocomplete="current-password"
        />
        <button type="submit">Log in</button>
        <p class="msg" id="lm"></p>
      </form>

      <!-- After login -->
      <div id="app" hidden>
        <div class="top">
          <h1>Our guests</h1>
          <button id="out" class="alt" type="button">Log out</button>
        </div>

        <div class="stats" id="stats"></div>

        <form id="add" class="addrow">
          <input
            id="gn"
            placeholder="Guest name"
            required
            maxlength="80"
            autocomplete="off"
          />
          <button type="submit">Add guest</button>
        </form>

        <p class="msg" id="msg"></p>
        <div id="list"></div>
      </div>
    </div>
    <script type="module" src="couple.js"></script>
    <script src="theme.js"></script>
  </body>
</html>
