<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wedding Invitation</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,600;1,300&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button id="themeBtn" class="theme-toggle" aria-label="Toggle dark mode">
      <svg class="moon" viewBox="0 0 24 24">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
      </svg>
      <svg class="sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4.5" />
        <path
          d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"
        />
      </svg>
    </button>

    <!-- TOP: photo, names, guest name, countdown -->
    <header class="hero" id="hero">
      <div class="hero-in">
        <p>The wedding of</p>
        <h1>
          <span id="g"></span><span class="amp">&amp;</span><span id="b"></span>
        </h1>
        <p class="date" id="when"></p>
        <p class="guest" id="guest">Dear Guest</p>
        <p>joyfully invites you to our wedding</p>
        <div id="cd"></div>
      </div>
      <a href="#story" class="down" aria-label="Scroll down">&#8595;</a>
    </header>

    <!-- OUR STORY -->
    <section class="white" id="story">
      <div class="wrap">
        <h2>Our story</h2>
        <div class="story">
          <img id="storyImg" alt="The couple" />
          <div id="storyText"></div>
        </div>
      </div>
    </section>

    <!-- VERSE -->
    <section class="verse" id="verseSec">
      <blockquote id="verse"></blockquote>
      <p id="verseRef"></p>
    </section>

    <!-- DETAILS -->
    <section id="details">
      <div class="wrap">
        <h2>The day</h2>
        <div class="info">
          <div><b>When</b><span id="d1"></span></div>
          <div><b>Where</b><span id="d2"></span></div>
        </div>
        <p class="center">
          <a class="btn" id="map" target="_blank" rel="noopener"
            >Open in Maps</a
          >
        </p>
      </div>
    </section>

    <!-- GALLERY (automatic slideshow) -->
    <section class="white" id="gallerySec">
      <div class="wrap">
        <h2>Our moments</h2>
        <div class="slideshow" id="slideshow">
          <div class="slides" id="slides"></div>
          <button class="sbtn" id="sPrev" aria-label="Previous">&#8249;</button>
          <button class="sbtn right" id="sNext" aria-label="Next">
            &#8250;
          </button>
          <div class="dots" id="dots"></div>
        </div>
      </div>
    </section>

    <!-- RSVP + WISH -->
    <section id="rsvpSec">
      <div class="wrap narrow">
        <h2>Will you come?</h2>
        <form id="rsvp">
          <label>Your answer</label>
          <div class="choice">
            <label
              ><input type="radio" name="a" value="1" checked /><span
                >Yes, I will come</span
              ></label
            >
            <label
              ><input type="radio" name="a" value="0" /><span
                >Sorry, I can't</span
              ></label
            >
          </div>

          <label for="rg">How many people (including you)?</label>
          <input id="rg" type="number" min="1" max="10" value="1" />

          <label for="rw">Your wish for the couple (optional)</label>
          <textarea id="rw" rows="4" maxlength="600"></textarea>

          <button type="submit">Send answer</button>
        </form>
        <p class="msg center" id="rm"></p>
      </div>
    </section>

    <!-- PHOTOS AFTER THE WEDDING -->
    <section class="album" id="albumSec">
      <div class="wrap narrow center">
        <h2>Share your photos and videos</h2>
        <p id="uNote"></p>
        <a class="btn" id="uBtn" target="_blank" rel="noopener" hidden
          >Open the shared album</a
        >
      </div>
    </section>

    <footer id="foot"></footer>

    <script type="module" src="script.js"></script>
  </body>
</html>
